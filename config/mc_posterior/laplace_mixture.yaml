# Multi-start Laplace mixture IS proposal + MALA (robust to multimodal posteriors).
# Shared by the train and eval MC oracles; n_post_samples is set per use case via
# train_n_post_samples / eval_n_post_samples in the experiment.
posterior_sampler: laplace_mixture
batch_size: 16
mala_steps: 5
mala_step_size: 0.1   # MALA refinement step after the mixture-IS proposal
laplace_reg: 1.0e-4   # diagonal regulariser on each Laplace Hessian
n_map_steps: 500      # optimiser steps to find each MAP / Laplace centre
sampler_kwargs:
  n_restarts: 8       # number of Laplace mixture components (multi-start)
