# @package _global_
# Variational posterior (var_post) training

experiment_name: var_post_stoch_pend

defaults:
  - /hydra: default
  - /bed_model: stochastic_pendulum
  - /policy_network: iqbal_lstm
  - /var_post: default
  - /wandb: default
  - _self_

# Global settings
seed: 0

# Override wandb settings
wandb:
  tags: ["results_24_05", "var_post"]

var_post:
  posterior_positional: true
  posterior_canonicalize_sources: false
  posterior_num_components: 3
  mc_posterior_mala_step_size: 0.01